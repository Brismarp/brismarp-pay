name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brismar
          POSTGRES_PASSWORD: brismar
          POSTGRES_DB: brismar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U brismar -d brismar_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://brismar:brismar@localhost:5432/brismar_test
      TEST_DATABASE_URL: postgresql://brismar:brismar@localhost:5432/brismar_test
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
      PAYMENT_PROVIDER: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Apply database schema
        run: npm run prisma:deploy
      - name: Build
        run: npm run build
      - name: Boot smoke
        run: |
          npm run start:prod &
          pid=$!
          trap 'kill $pid 2>/dev/null' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/v1/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          echo 'API did not become healthy in time'
          exit 1
      - name: Unit tests
        run: npm test -- --runInBand --coverage
      - name: E2E tests
        run: npm run test:e2e -- --runInBand

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brismar
          POSTGRES_PASSWORD: brismar
          POSTGRES_DB: brismar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U brismar -d brismar_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://brismar:brismar@localhost:5432/brismar_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
      PAYMENT_PROVIDER: mock
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      - name: Generate Prisma client
        run: npm run prisma:generate
        working-directory: apps/api
      - name: Apply database schema
        run: npm run prisma:deploy
        working-directory: apps/api
      - name: Build API
        run: npm run build
        working-directory: apps/api
      - name: Build web
        run: npm run build
        working-directory: apps/web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start API
        working-directory: apps/api
        run: |
          npm run start:prod &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/v1/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          echo 'API did not become healthy in time'
          exit 1
      - name: Playwright
        working-directory: apps/web
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
        run: npm run test:e2e
